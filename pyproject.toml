[project]
name = "service-template"
version = "0.1.0"
description = "Starter template for a spec-driven FastAPI backend service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "schemathesis>=4.29.4",
]

# --- Lint and format ---------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "N",            # naming
    "UP",           # modern Python idioms
    "B",            # likely bugs
    "C4", "SIM",    # simpler comprehensions and control flow
    "C90",          # complexity (see max-complexity below)
    "PLR0913",      # too many arguments
    "PLR0915",      # too many statements
    "DTZ",          # timezone-naive datetimes
    "S",            # security
    "T20",          # stray print()
    "ERA",          # commented-out code
    "PT",           # pytest style
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]    # assert is how pytest works
"scripts/**" = ["T20"]   # command-line scripts print their output

# --- Types ---------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

# --- Architecture (docs/architecture/overview.md) ------------------------------

[tool.importlinter]
root_package = "service_template"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inwards: main > api, adapters > application > domain"
type = "layers"
layers = [
    "service_template.main",
    "service_template.api | service_template.adapters",
    "service_template.application",
    "service_template.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application code stay free of frameworks and I/O"
type = "forbidden"
source_modules = [
    "service_template.domain",
    "service_template.application",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "uvicorn",
    "httpx",
    "httpx2",
    "sqlalchemy",
]

# --- Tests ---------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=service_template",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
markers = [
    "covers(criterion): acceptance criterion this test verifies, written as '<spec id>:AC-<n>'",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "\\.\\.\\.$",  # protocol method bodies
]
