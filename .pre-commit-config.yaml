# Fast checks before each commit. The tools and their versions come from
# uv.lock, so hooks, `make check` and CI always run the same thing.
# Install once with `make setup`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: layering rules
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
